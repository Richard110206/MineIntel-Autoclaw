services:
  neo4j:
    image: ${MINEINTEL_NEO4J_IMAGE:-neo4j:5.26-community}
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${MINEINTEL_NEO4J_PASSWORD:?Set MINEINTEL_NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - mineintel_neo4j_data:/data
      - mineintel_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mineintel_neo4j_data:
  mineintel_neo4j_logs:
